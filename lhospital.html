<!DOCTYPE html>
<html>
    <head>
        <title>L'Hospitali reegel</title>
    </head>
    <body>
        <h1>L'Hospitali reegel</h1>
        <p>Oletame, et on kaks funktsiooni f(x) ja g(x) ja nende mõlema piirväärtus mõnes punktis x=a on 0.</p>
        <math><mrow><munder><mi>lim</mi><mrow>x → a</mrow></munder>f(x)<mo>=</mo>0</mrow></math>
        <math><mrow><munder><mi>lim</mi><mrow>x → a</mrow></munder>f(x)<mo>=</mo>0</mrow></math>
        <p>Siis on nende kahe funktsiooni jagatise piirväärtus võrdne nende tuletiste piirväärtustega.</p>
        <math display="block">
            <munder>
                <mi>lim</mi>
                <mrow>x → a</mrow>
            </munder>
            <mfrac>
                <mrow>f(x)</mrow>
                <mrow>g(x)</mrow>
            </mfrac>
            <mo>=</mo>
                        <munder>
                <mi>lim</mi>
                <mrow>x → a</mrow>
            </munder>
            <mfrac>
                <mrow>f<mo>'</mo>(x)</mrow>
                <mrow>g<mo>'</mo>(x)</mrow>
            </mfrac>
        </math>
    </body>
</html>
